[mod-name]
planet-market=星球市场

[mod-description]
planet-market=在每个星球出生点附近生成金币市场，定时发放金币；管理员可用命令在地图上额外放置市场。灵感来自 majoro 的原版场景，由船长修改发布。

[item-name]
market=市场

[item-description]
market=用金币购买装备的商店。放下后打开即可交易。

[entity-name]
market=市场

[entity-description]
market=用金币购买装备。

[mod-setting-name]
planet-market-auto-spawn=在星球上自动生成市场
planet-market-coin-amount=每分钟发放金币数量
planet-market-disable-techs=禁用部分科技
planet-market-speed-tweaks=应用移速与手搓加成

[mod-setting-description]
planet-market-auto-spawn=在每个星球出生点附近生成不可破坏的市场（Nauvis 与太空时代星球）。
planet-market-coin-amount=每隔 3600 tick（约 1 分钟）给每位在线玩家发放的金币数量。设为 0 可关闭发放。
planet-market-disable-techs=禁用跟随机器人数量科技；若启用太空时代，同时禁用火炮、机甲、聚变反应堆模块和 MK3 电池。
planet-market-speed-tweaks=建设机器人移速 +100%，角色移速 +80%，手搓速度 +400%。默认关闭。

[planet-market]
command-spawn-help=仅管理员。在当前位置生成市场，或指定坐标：/spawn-market [x y]
command-give-help=仅管理员。给自己一个可放置的市场物品。
need-admin=只有管理员可以使用该命令。
spawned=已生成市场。
spawn-failed=无法在此处生成市场。
given=已把市场物品放入背包。
give-failed=无法放入市场物品（背包可能已满）。
