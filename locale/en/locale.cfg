[mod-name]
planet-market=Planet Market

[mod-description]
planet-market=Spawns a coin market near each planet spawn, pays coins on a timer, and lets admins place extra markets. Inspired by majoro's original scenario, edited by 船长.

[item-name]
market=Market

[item-description]
market=A coin shop. Place it, then open it to buy equipment.

[entity-name]
market=Market

[entity-description]
market=Buy equipment with coins.

[mod-setting-name]
planet-market-auto-spawn=Auto-spawn markets on planets
planet-market-coin-amount=Coins paid each minute
planet-market-disable-techs=Disable selected technologies
planet-market-speed-tweaks=Apply speed and crafting bonuses

[mod-setting-description]
planet-market-auto-spawn=Create an indestructible market near each planet spawn (Nauvis and Space Age planets).
planet-market-coin-amount=Coins given to every connected player every 3600 ticks (about 1 minute). Set to 0 to disable.
planet-market-disable-techs=Disable follower robot count techs, and with Space Age also artillery, mech armor, fusion reactor equipment, and battery MK3.
planet-market-speed-tweaks=Worker robots +100% speed, character running +80%, manual crafting +400%. Off by default.

[planet-market]
command-spawn-help=Admin only. Spawn a market at your position, or at coordinates: /spawn-market [x y]
command-give-help=Admin only. Give yourself a placeable market item.
need-admin=Only admins can use this command.
spawned=Market created.
spawn-failed=Could not create a market here.
given=Market item added to your inventory.
give-failed=Could not insert the market item (inventory full?).
